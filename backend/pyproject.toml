[project]
name = "retake-backend"
version = "0.1.0"
description = "Backend de Retake: datos de la liga (spec 002) y su obtención y actualización (spec 003)."
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2",
    "psycopg[binary]",
    "alembic",
    "pydantic-settings",
    "pyyaml",
    "httpx>=0.28.1",
    "argon2-cffi>=25.1.0",
    "pillow>=12.3.0",
]

[project.scripts]
retake = "app.cli:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
